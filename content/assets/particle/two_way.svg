<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="680" height="300" font-family="sans-serif">
<rect width="680" height="300" fill="white"/>
<text x="340.0" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">物质与能量的双向门（阈值：2mₑc² ≈ 1.022 MeV）</text>
<text x="170" y="70" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#333">湮灭（湮没质能 → 光子）</text>
<circle cx="115" cy="205" r="9" fill="#d9a441"/>
<text x="115" y="235" text-anchor="middle" font-size="12.5" fill="#333">e⁺</text>
<line x1="129" y1="198" x2="151" y2="168" stroke="#d9a441" stroke-width="2"/>
<line x1="151" y1="168" x2="150" y2="177" stroke="#d9a441" stroke-width="2"/>
<line x1="151" y1="168" x2="143" y2="172" stroke="#d9a441" stroke-width="2"/>
<circle cx="225" cy="205" r="9" fill="#4c86c6"/>
<text x="225" y="235" text-anchor="middle" font-size="12.5" fill="#333">e⁻</text>
<line x1="211" y1="198" x2="189" y2="168" stroke="#4c86c6" stroke-width="2"/>
<line x1="189" y1="168" x2="197" y2="172" stroke="#4c86c6" stroke-width="2"/>
<line x1="189" y1="168" x2="190" y2="177" stroke="#4c86c6" stroke-width="2"/>
<line x1="148" y1="142" x2="30" y2="103" stroke="#f5b942" stroke-width="2.2"/>
<line x1="30" y1="103" x2="39" y2="101" stroke="#f5b942" stroke-width="2.2"/>
<line x1="30" y1="103" x2="36" y2="110" stroke="#f5b942" stroke-width="2.2"/>
<text x="16" y="89" text-anchor="middle" font-size="12.5" fill="#b8860b">γ 511 keV</text>
<line x1="192" y1="142" x2="310" y2="103" stroke="#f5b942" stroke-width="2.2"/>
<line x1="310" y1="103" x2="304" y2="110" stroke="#f5b942" stroke-width="2.2"/>
<line x1="310" y1="103" x2="301" y2="101" stroke="#f5b942" stroke-width="2.2"/>
<text x="324" y="89" text-anchor="middle" font-size="12.5" fill="#b8860b">γ 511 keV</text>
<text x="170" y="112" text-anchor="middle" font-size="12" fill="#666">动量守恒要求两个光子背向飞行</text>
<line x1="340.0" y1="50" x2="340.0" y2="250" stroke="#ccc" stroke-width="1" stroke-dasharray="5,5"/>
<text x="340.0" y="150" text-anchor="middle" font-size="20" fill="#999">⇄</text>
<text x="510" y="70" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#333">对产生（光子 → 粒子对）</text>
<circle cx="510" cy="120" r="12" fill="none" stroke="#666" stroke-width="2"/>
<text x="510" y="98" text-anchor="middle" font-size="12" fill="#666">原子核（接走反冲）</text>
<line x1="320" y1="120" x2="492" y2="120" stroke="#f5b942" stroke-width="2.2"/>
<text x="410" y="108" text-anchor="middle" font-size="12.5" fill="#b8860b">γ ≥ 1.022 MeV</text>
<line x1="495" y1="126" x2="471" y2="195" stroke="#4c86c6" stroke-width="2"/>
<circle cx="450" cy="205" r="9" fill="#4c86c6"/>
<text x="450" y="235" text-anchor="middle" font-size="12.5" fill="#333">e⁻</text>
<line x1="525" y1="126" x2="549" y2="195" stroke="#d9a441" stroke-width="2"/>
<circle cx="570" cy="205" r="9" fill="#d9a441"/>
<text x="570" y="235" text-anchor="middle" font-size="12.5" fill="#333">e⁺</text>
<text x="510" y="142" text-anchor="middle" font-size="12" fill="#666">必须在核旁发生，由核带走少量反冲动量</text>
<text x="340.0" y="288" text-anchor="middle" font-size="12.5" fill="#555">同一组守恒律（能量、动量、电荷）统治两个方向——单向的时间箭头在这里是双向的</text>
</svg>