<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" width="720" height="520" font-family="Segoe UI, Microsoft YaHei, Helvetica, Arial, sans-serif"><rect width="720" height="520" fill="white"/>
<text x="360.0" y="28.0" font-size="16" fill="#2B2B2B" text-anchor="middle" font-weight="bold">卫府制的层级：卫统府，府统团旅队火</text>
<text x="360.0" y="50.0" font-size="12" fill="#5A5A5A" text-anchor="middle">十二卫遥领全国折冲府，十六卫中余下四卫专掌门户与贴身宿卫</text>
<rect x="290.0" y="78.0" width="140.0" height="42.0" rx="8" fill="#D55E00" fill-opacity="0.26" stroke="#D55E00" stroke-width="1.5"/>
<text x="360.0" y="103.9" font-size="13.5" fill="#2B2B2B" text-anchor="middle" font-weight="bold">皇　帝</text>
<path d="M 360.0 120.0 L 360.0 146.0" fill="none" stroke="#D55E00" stroke-width="1.6"/>
<rect x="24.0" y="152.0" width="152.0" height="62.0" rx="8" fill="#0072B2" fill-opacity="0.16" stroke="#0072B2" stroke-width="1.5"/>
<text x="100.0" y="170.5" font-size="12.5" fill="#2B2B2B" text-anchor="middle" font-weight="bold">兵　部</text>
<text x="100.0" y="187.3" font-size="12" fill="#2B2B2B" text-anchor="middle">掌军籍、番第</text>
<text x="100.0" y="204.3" font-size="12" fill="#2B2B2B" text-anchor="middle">与调发</text>
<path d="M 100.0 146.0 L 100.0 152.0" fill="none" stroke="#AFAFAF" stroke-width="1.6"/>
<rect x="200.0" y="152.0" width="136.0" height="62.0" rx="8" fill="#0072B2" fill-opacity="0.16" stroke="#0072B2" stroke-width="1.5"/>
<text x="268.0" y="170.5" font-size="12.5" fill="#2B2B2B" text-anchor="middle" font-weight="bold">十六卫（南衙）</text>
<text x="268.0" y="187.3" font-size="12" fill="#2B2B2B" text-anchor="middle">十二卫统折冲府</text>
<text x="268.0" y="204.3" font-size="12" fill="#2B2B2B" text-anchor="middle">四卫掌门户宿卫</text>
<path d="M 268.0 146.0 L 268.0 152.0" fill="none" stroke="#AFAFAF" stroke-width="1.6"/>
<rect x="352.0" y="152.0" width="136.0" height="62.0" rx="8" fill="#0072B2" fill-opacity="0.16" stroke="#0072B2" stroke-width="1.5"/>
<text x="420.0" y="170.5" font-size="12.5" fill="#2B2B2B" text-anchor="middle" font-weight="bold">东宫十率</text>
<text x="420.0" y="187.3" font-size="12" fill="#2B2B2B" text-anchor="middle">太子系统的</text>
<text x="420.0" y="204.3" font-size="12" fill="#2B2B2B" text-anchor="middle">军事机构</text>
<path d="M 420.0 146.0 L 420.0 152.0" fill="none" stroke="#AFAFAF" stroke-width="1.6"/>
<rect x="504.0" y="152.0" width="192.0" height="62.0" rx="8" fill="#0072B2" fill-opacity="0.16" stroke="#0072B2" stroke-width="1.5"/>
<text x="600.0" y="162.0" font-size="12.5" fill="#2B2B2B" text-anchor="middle" font-weight="bold">北衙禁军</text>
<text x="600.0" y="178.8" font-size="12" fill="#2B2B2B" text-anchor="middle">羽林、龙武、</text>
<text x="600.0" y="195.8" font-size="12" fill="#2B2B2B" text-anchor="middle">神武、神策</text>
<text x="600.0" y="212.8" font-size="12" fill="#2B2B2B" text-anchor="middle">直属皇帝</text>
<path d="M 600.0 146.0 L 600.0 152.0" fill="none" stroke="#AFAFAF" stroke-width="1.6"/>
<path d="M 360.0 214.0 L 360.0 250.0" fill="none" stroke="#AFAFAF" stroke-width="1.6"/>
<rect x="150.0" y="250.0" width="420.0" height="62.0" rx="8" fill="#56B4E9" fill-opacity="0.22" stroke="#56B4E9" stroke-width="1.5"/>
<text x="360.0" y="277.2" font-size="13" fill="#2B2B2B" text-anchor="middle" font-weight="bold">折冲府（全国约 634 府）</text>
<text x="360.0" y="293.8" font-size="12" fill="#2B2B2B" text-anchor="middle">上府 1200 人　中府 1000 人　下府 800 人</text>
<path d="M 360.0 312.0 L 360.0 350.0" fill="none" stroke="#AFAFAF" stroke-width="1.6"/>
<rect x="47.0" y="350.0" width="140.0" height="68.0" rx="8" fill="#009E73" fill-opacity="0.18" stroke="#009E73" stroke-width="1.5"/>
<text x="117.0" y="380.2" font-size="13" fill="#2B2B2B" text-anchor="middle" font-weight="bold">团　200 人</text>
<text x="117.0" y="396.8" font-size="12" fill="#2B2B2B" text-anchor="middle">统将：校尉</text>
<path d="M 189.0 384 L 205.0 384" fill="none" stroke="#009E73" stroke-width="2"/>
<path d="M 199.0 379 L 206.0 384 L 199.0 389" fill="none" stroke="#009E73" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="209.0" y="350.0" width="140.0" height="68.0" rx="8" fill="#009E73" fill-opacity="0.18" stroke="#009E73" stroke-width="1.5"/>
<text x="279.0" y="380.2" font-size="13" fill="#2B2B2B" text-anchor="middle" font-weight="bold">旅　100 人</text>
<text x="279.0" y="396.8" font-size="12" fill="#2B2B2B" text-anchor="middle">统将：旅帅</text>
<path d="M 351.0 384 L 367.0 384" fill="none" stroke="#009E73" stroke-width="2"/>
<path d="M 361.0 379 L 368.0 384 L 361.0 389" fill="none" stroke="#009E73" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="371.0" y="350.0" width="140.0" height="68.0" rx="8" fill="#009E73" fill-opacity="0.18" stroke="#009E73" stroke-width="1.5"/>
<text x="441.0" y="380.2" font-size="13" fill="#2B2B2B" text-anchor="middle" font-weight="bold">队　50 人</text>
<text x="441.0" y="396.8" font-size="12" fill="#2B2B2B" text-anchor="middle">统将：队正</text>
<path d="M 513.0 384 L 529.0 384" fill="none" stroke="#009E73" stroke-width="2"/>
<path d="M 523.0 379 L 530.0 384 L 523.0 389" fill="none" stroke="#009E73" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="533.0" y="350.0" width="140.0" height="68.0" rx="8" fill="#009E73" fill-opacity="0.18" stroke="#009E73" stroke-width="1.5"/>
<text x="603.0" y="380.2" font-size="13" fill="#2B2B2B" text-anchor="middle" font-weight="bold">火　10 人</text>
<text x="603.0" y="396.8" font-size="12" fill="#2B2B2B" text-anchor="middle">统将：火长</text>
<text x="24.0" y="458.0" font-size="12" fill="#5A5A5A">每府置折冲都尉一人、左右果毅都尉各一人，下辖四至六团；</text>
<text x="24.0" y="478.0" font-size="12" fill="#5A5A5A">府兵平时在家务农，按番次轮流上番宿卫，每次一个月；远处可纳资代番。</text>
<text x="24.0" y="500.0" font-size="12" fill="#5A5A5A">全国折冲府并非都要进京：东北、江南等地的府兵主要承担地方任务。</text>
</svg>