<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 344" width="720" height="344" font-family="Segoe UI, Microsoft YaHei, Helvetica, Arial, sans-serif"><rect width="720" height="344" fill="white"/>
<text x="360.0" y="28.0" font-size="16" fill="#2B2B2B" text-anchor="middle" font-weight="bold">两个字没有可互换的时间窗口</text>
<text x="360.0" y="50.0" font-size="12" fill="#5A5A5A" text-anchor="middle">射自甲骨文起一直在用；「矮」迟至小篆才出现</text>
<path d="M 96 178 L 664 178" fill="none" stroke="#5A5A5A" stroke-width="2.0"/>
<path d="M 122 171 L 122 185" fill="none" stroke="#5A5A5A" stroke-width="2.0"/>
<text x="122.0" y="204.0" font-size="12" fill="#5A5A5A" text-anchor="middle">商·甲骨文</text>
<path d="M 258 171 L 258 185" fill="none" stroke="#5A5A5A" stroke-width="2.0"/>
<text x="258.0" y="204.0" font-size="12" fill="#5A5A5A" text-anchor="middle">西周·金文</text>
<path d="M 402 171 L 402 185" fill="none" stroke="#5A5A5A" stroke-width="2.0"/>
<text x="402.0" y="204.0" font-size="12" fill="#5A5A5A" text-anchor="middle">秦·小篆</text>
<path d="M 532 171 L 532 185" fill="none" stroke="#5A5A5A" stroke-width="2.0"/>
<text x="532.0" y="204.0" font-size="12" fill="#5A5A5A" text-anchor="middle">汉·隶书</text>
<path d="M 646 171 L 646 185" fill="none" stroke="#5A5A5A" stroke-width="2.0"/>
<text x="646.0" y="204.0" font-size="12" fill="#5A5A5A" text-anchor="middle">今·楷书</text>
<rect x="96" y="132" width="568" height="18" rx="9" fill="#009E73" fill-opacity="0.18" stroke="#009E73" stroke-width="1.4"/>
<text x="380.0" y="125.0" font-size="12" fill="#009E73" text-anchor="middle" font-weight="bold">射：甲骨文已见，本义始终是射箭</text>
<rect x="96" y="212" width="306" height="18" rx="9" fill="none" stroke="#AFAFAF" stroke-width="1.4" stroke-dasharray="6,5"/>
<rect x="402" y="212" width="262" height="18" rx="9" fill="#0072B2" fill-opacity="0.18" stroke="#0072B2" stroke-width="1.4"/>
<text x="268.0" y="250.0" font-size="12" fill="#AFAFAF" text-anchor="middle" font-weight="bold">甲骨文、金文中均不见「矮」</text>
<text x="534.0" y="250.0" font-size="12" fill="#0072B2" text-anchor="middle" font-weight="bold">最早见于小篆</text>
<path d="M 402 100 L 402 288" fill="none" stroke="#D55E00" stroke-width="1.4" stroke-dasharray="4,4"/>
<text x="402.0" y="92.0" font-size="12" fill="#D55E00" text-anchor="middle" font-weight="bold">矮字登场</text>
<text x="24.0" y="328.0" font-size="12" fill="#5A5A5A">时间刻度未按比例；「矮」的最早形体依据字书与出土文字材料。</text>
</svg>