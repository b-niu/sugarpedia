<text x="254.0" y="150.0" font-size="12" fill="#D55E00" text-anchor="middle" font-weight="bold">矢</text>
<text x="316.0" y="120.0" font-size="12.5" fill="#2B2B2B">张弓搭箭之形：左侧是弓，右侧是箭</text>
<text x="24.0" y="220.0" font-size="12.5" fill="#2B2B2B" font-weight="bold">金文·西周</text>
<rect x="148" y="174" width="152" height="82" rx="10" fill="#FAFBFC" stroke="#DCE3EA" stroke-width="1.4"/>
<path d="M 162.0 187.6 L 169.1 191.2 L 173.9 199.1 L 175.2 207.0 L 173.9 214.9 L 169.1 222.8 L 162.0 226.4" fill="none" stroke="#0072B2" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/>
