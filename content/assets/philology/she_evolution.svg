<text x="194.0" y="150.0" font-size="12" fill="#0072B2" text-anchor="middle" font-weight="bold">弓</text>
<path d="M 254.0 85.0 L 254.0 129.0" fill="none" stroke="#D55E00" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/>
