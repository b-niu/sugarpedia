<text x="254.0" y="350.0" font-size="12" fill="#D55E00" text-anchor="middle" font-weight="bold">矢</text>
<text x="316.0" y="320.0" font-size="12.5" fill="#2B2B2B">弓背的轮廓走样成了「身」，字作「䠶」</text>
<text x="24.0" y="420.0" font-size="12.5" fill="#2B2B2B" font-weight="bold">小篆·秦（二系）</text>
<rect x="148" y="374" width="152" height="82" rx="10" fill="#FAFBFC" stroke="#DCE3EA" stroke-width="1.4"/>
