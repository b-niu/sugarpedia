<text x="194.0" y="450.0" font-size="12" fill="#D55E00" text-anchor="middle" font-weight="bold">身</text>
<path d="M 264.4 386.1 L 252.8 407.0 L 238.9 426.7" fill="none" stroke="#009E73" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 252.8 407.0 L 266.8 402.4" fill="none" stroke="#009E73" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 256.3 418.6 L 270.2 418.6" fill="none" stroke="#009E73" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/>
<text x="254.0" y="450.0" font-size="12" fill="#009E73" text-anchor="middle" font-weight="bold">寸</text>
<text x="316.0" y="420.0" font-size="12.5" fill="#2B2B2B">承接金文的那只手「又」走样成了「寸」</text>
<text x="24.0" y="520.0" font-size="12.5" fill="#2B2B2B" font-weight="bold">楷书·今</text>
<rect x="148" y="474" width="152" height="82" rx="10" fill="#FAFBFC" stroke="#DCE3EA" stroke-width="1.4"/>
<text x="224.0" y="531.0" font-size="40" fill="#4A4A4A" text-anchor="middle" font-weight="bold">射</text>
<text x="316.0" y="520.0" font-size="12.5" fill="#2B2B2B">两系合流，规范字形定为「射」</text>
<text x="24.0" y="556.0" font-size="12" fill="#5A5A5A">同一颜色＝同一个构件：弓（蓝）在后世走样为身（红），又（绿）走样为寸（绿）。</text>
<text x="24.0" y="576.0" font-size="12" fill="#5A5A5A">字形为按构形理据绘制的示意图，用折线近似，不摹写古文字原形。</text>
</svg>