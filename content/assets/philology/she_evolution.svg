<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 596" width="720" height="596" font-family="Segoe UI, Microsoft YaHei, Helvetica, Arial, sans-serif"><rect width="720" height="596" fill="white"/>
<text x="360.0" y="28.0" font-size="16" fill="#2B2B2B" text-anchor="middle" font-weight="bold">「射」的构件走形：弓→身，又→寸</text>
<text x="360.0" y="50.0" font-size="12" fill="#5A5A5A" text-anchor="middle">同一个字，两侧构件各自走样，全程与「矮」无关</text>
<text x="24.0" y="120.0" font-size="12.5" fill="#2B2B2B" font-weight="bold">甲骨文·商</text>
