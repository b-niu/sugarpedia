<path d="M 254.0 285.0 L 254.0 329.0" fill="none" stroke="#D55E00" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 244.7 296.6 L 254.0 283.8 L 263.3 296.6" fill="none" stroke="#D55E00" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/>
