<text x="271.0" y="250.0" font-size="12" fill="#009E73" text-anchor="middle" font-weight="bold">又</text>
<text x="316.0" y="220.0" font-size="12.5" fill="#2B2B2B">再添一只手（又），表示引弓而发</text>
<text x="24.0" y="320.0" font-size="12.5" fill="#2B2B2B" font-weight="bold">小篆·秦（一系）</text>
