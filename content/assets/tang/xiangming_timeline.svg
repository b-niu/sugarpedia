<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" font-family="Segoe UI, Microsoft YaHei, Helvetica, Arial, sans-serif"><rect width="720" height="360" fill="white"/>
<text x="360.0" y="28.0" font-size="16" fill="#2B2B2B" text-anchor="middle" font-weight="bold">宰相名号与机构改名：618—767</text>
<text x="360.0" y="50.0" font-size="12" fill="#5A5A5A" text-anchor="middle">同一批职位，名号改了三轮；玄宗以后，宰相头衔渐渐固定在「同平章事」上</text>
