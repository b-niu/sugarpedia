<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 424" width="720" height="424" font-family="Segoe UI, Microsoft YaHei, Helvetica, Arial, sans-serif"><rect width="720" height="424" fill="white"/>
<text x="360.0" y="28.0" font-size="16" fill="#2B2B2B" text-anchor="middle" font-weight="bold">将军：重号四层与杂号</text>
<text x="360.0" y="50.0" font-size="12" fill="#5A5A5A" text-anchor="middle">重号将军名号固定、位次明确；杂号将军因事而设，名号无定</text>
<rect x="24.0" y="78.0" width="360.0" height="58.0" rx="8" fill="#0072B2" fill-opacity="0.26" stroke="#0072B2" stroke-width="1.5"/>
<text x="204.0" y="102.7" font-size="13" fill="#2B2B2B" text-anchor="middle" font-weight="bold">大将军</text>
<text x="204.0" y="120.3" font-size="12.0" fill="#2B2B2B" text-anchor="middle">位在三公之上</text>
<rect x="24.0" y="152.0" width="330.0" height="58.0" rx="8" fill="#D55E00" fill-opacity="0.22" stroke="#D55E00" stroke-width="1.5"/>
<text x="189.0" y="176.7" font-size="13" fill="#2B2B2B" text-anchor="middle" font-weight="bold">骠骑将军 · 车骑将军 · 卫将军</text>
<text x="189.0" y="194.3" font-size="12.0" fill="#2B2B2B" text-anchor="middle">位比公，在三公之下</text>
<rect x="24.0" y="226.0" width="300.0" height="58.0" rx="8" fill="#56B4E9" fill-opacity="0.2" stroke="#56B4E9" stroke-width="1.5"/>
<text x="174.0" y="250.7" font-size="13" fill="#2B2B2B" text-anchor="middle" font-weight="bold">前将军 · 后将军 · 左将军 · 右将军</text>
<text x="174.0" y="268.3" font-size="12.0" fill="#2B2B2B" text-anchor="middle">位次上卿，不常置</text>
<rect x="24.0" y="300.0" width="270.0" height="58.0" rx="8" fill="#AFAFAF" fill-opacity="0.18" stroke="#AFAFAF" stroke-width="1.5"/>
<text x="159.0" y="324.7" font-size="13" fill="#2B2B2B" text-anchor="middle" font-weight="bold">杂　号　将　军</text>
<text x="159.0" y="342.3" font-size="12.0" fill="#2B2B2B" text-anchor="middle">因战事或职能临时设立</text>
<rect x="408.0" y="78.0" width="288.0" height="258.0" rx="8" fill="#009E73" fill-opacity="0.08" stroke="#009E73" stroke-width="1.5"/>
<text x="420.0" y="104.0" font-size="12.5" fill="#009E73" font-weight="bold">杂号的命名有章可循</text>
<text x="420.0" y="134.0" font-size="12.0" fill="#2B2B2B">按兵种：轻车、材官、楼船、强弩</text>
<text x="420.0" y="160.0" font-size="12.0" fill="#2B2B2B">按对象：伏波、破羌、度辽、横海</text>
<text x="420.0" y="186.0" font-size="12.0" fill="#2B2B2B">按职能：护军、骁骑、骑都尉</text>
<text x="420.0" y="212.0" font-size="12.0" fill="#2B2B2B"></text>
<text x="420.0" y="238.0" font-size="12.0" fill="#2B2B2B">汉代杂号已名目繁多，到南北朝</text>
<text x="420.0" y="264.0" font-size="12.0" fill="#2B2B2B">更增至三百六十一种——「将军」</text>
<text x="420.0" y="290.0" font-size="12.0" fill="#2B2B2B">二字由此严重贬值。</text>
<text x="24.0" y="382.0" font-size="12" fill="#5A5A5A">重号将军均开府：长史、司马各一人，从事中郎二人，掾属二十九人等。</text>
<text x="24.0" y="404.0" font-size="12" fill="#5A5A5A">将军以本号领军的，其下各有部曲与校尉；东汉重号将军多不常置。</text>
</svg>