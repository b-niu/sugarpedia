<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430" font-family="Segoe UI, Microsoft YaHei, Helvetica, Arial, sans-serif"><rect width="720" height="430" fill="white"/>
<text x="360.0" y="28.0" font-size="16" fill="#2B2B2B" text-anchor="middle" font-weight="bold">司隶校尉：品级不高，权势极重</text>
<text x="360.0" y="50.0" font-size="12" fill="#5A5A5A" text-anchor="middle">左为秩禄对比（条越长秩越高），右为它真正掌握的东西</text>
<text x="36.0" y="84.0" font-size="12.5" fill="#2B2B2B" font-weight="bold">秩禄对比</text>
<rect x="36.0" y="104.0" width="132.0" height="44.0" rx="6" fill="#56B4E9" fill-opacity="0.2" stroke="#56B4E9" stroke-width="1.5"/>
<text x="102.0" y="130.5" font-size="12.5" fill="#2B2B2B" text-anchor="middle" font-weight="bold">刺史</text>
<text x="180.0" y="133.0" font-size="12.0" fill="#2B2B2B">六百石</text>
<rect x="36.0" y="166.0" width="250.0" height="44.0" rx="6" fill="#0072B2" fill-opacity="0.2" stroke="#0072B2" stroke-width="1.5"/>
<text x="161.0" y="192.5" font-size="12.5" fill="#2B2B2B" text-anchor="middle" font-weight="bold">司隶校尉</text>
<text x="298.0" y="195.0" font-size="12.0" fill="#2B2B2B">比二千石</text>
<rect x="36.0" y="228.0" width="272.0" height="44.0" rx="6" fill="#D55E00" fill-opacity="0.2" stroke="#D55E00" stroke-width="1.5"/>
<text x="172.0" y="254.5" font-size="12.5" fill="#2B2B2B" text-anchor="middle" font-weight="bold">州牧</text>
<text x="320.0" y="257.0" font-size="12.0" fill="#2B2B2B">二千石</text>
<rect x="370.0" y="70.0" width="326.0" height="268.0" rx="8" fill="#009E73" fill-opacity="0.08" stroke="#009E73" stroke-width="1.5"/>
<text x="386.0" y="96.0" font-size="12.5" fill="#009E73" font-weight="bold">它实际掌握的</text>
<text x="386.0" y="124.0" font-size="12.0" fill="#2B2B2B" font-weight="bold">三独坐</text>
<text x="446.0" y="124.0" font-size="12.0" fill="#2B2B2B">朝会专席，与御史中丞、</text>
<text x="446.0" y="144.0" font-size="12.0" fill="#2B2B2B">尚书令并列，为皇帝所优宠</text>
<text x="386.0" y="178.0" font-size="12.0" fill="#2B2B2B" font-weight="bold">察京师</text>
<text x="446.0" y="178.0" font-size="12.0" fill="#2B2B2B">辖京兆、冯翊、扶风、弘农、</text>
<text x="446.0" y="198.0" font-size="12.0" fill="#2B2B2B">河内、河东、河南共七郡</text>
<text x="386.0" y="232.0" font-size="12.0" fill="#2B2B2B" font-weight="bold">号卧虎</text>
<text x="446.0" y="232.0" font-size="12.0" fill="#2B2B2B">旧有此称，百僚畏之</text>
<text x="386.0" y="266.0" font-size="12.0" fill="#2B2B2B" font-weight="bold">属　官</text>
<text x="446.0" y="266.0" font-size="12.0" fill="#2B2B2B">从事史十二人，都官从事</text>
<text x="446.0" y="286.0" font-size="12.0" fill="#2B2B2B">掌察举百官犯法</text>
<text x="386.0" y="320.0" font-size="12.0" fill="#2B2B2B" font-weight="bold">位　次</text>
<text x="446.0" y="320.0" font-size="12.0" fill="#2B2B2B">魏晋时坐于端门外，</text>
<text x="446.0" y="340.0" font-size="12.0" fill="#2B2B2B">位在诸卿之上</text>
<text x="24.0" y="388.0" font-size="12" fill="#5A5A5A">沿革：汉武帝征和四年（前89）置；成帝元延四年省，哀帝复置称司隶；东汉复称司隶校尉。</text>
<text x="24.0" y="410.0" font-size="12" fill="#5A5A5A">汉百官朝会一般接席而坐，唯此三官独坐一席，是皇帝给的优宠。</text>
</svg>