<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 424" width="720" height="424" font-family="Segoe UI, Microsoft YaHei, Helvetica, Arial, sans-serif"><rect width="720" height="424" fill="white"/>
<text x="360.0" y="28.0" font-size="16" fill="#2B2B2B" text-anchor="middle" font-weight="bold">同名不同物：汉代与唐代的「中郎将」</text>
<text x="360.0" y="50.0" font-size="12" fill="#5A5A5A" text-anchor="middle">左边是宫官系统的侍从武官，右边是十六卫系统的统兵官</text>
<text x="178.0" y="80.0" font-size="14" fill="#0072B2" text-anchor="middle" font-weight="bold">汉代</text>
<rect x="48.0" y="92.0" width="260.0" height="40.0" rx="8" fill="#D55E00" fill-opacity="0.18" stroke="#D55E00" stroke-width="1.5"/>
<text x="178.0" y="116.5" font-size="12.5" fill="#2B2B2B" text-anchor="middle" font-weight="bold">皇　帝</text>
<rect x="48.0" y="146.0" width="260.0" height="40.0" rx="8" fill="#0072B2" fill-opacity="0.16" stroke="#0072B2" stroke-width="1.5"/>
<text x="178.0" y="170.3" font-size="12" fill="#2B2B2B" text-anchor="middle">光禄勋（九卿之一，掌宫殿门户）</text>
<path d="M 178 132 L 178 146" fill="none" stroke="#AFAFAF" stroke-width="1.6"/>
<text x="178.0" y="200.0" font-size="12" fill="#5A5A5A" text-anchor="middle">各置中郎将，分统郎官</text>
<rect x="34.0" y="208.0" width="50.0" height="36.0" rx="6" fill="#56B4E9" fill-opacity="0.16" stroke="#56B4E9" stroke-width="1.2"/>
<text x="59.0" y="230.3" font-size="12.0" fill="#2B2B2B" text-anchor="middle" font-weight="bold">五官</text>
<rect x="90.0" y="208.0" width="50.0" height="36.0" rx="6" fill="#56B4E9" fill-opacity="0.16" stroke="#56B4E9" stroke-width="1.2"/>
<text x="115.0" y="230.3" font-size="12.0" fill="#2B2B2B" text-anchor="middle" font-weight="bold">左</text>
<rect x="146.0" y="208.0" width="50.0" height="36.0" rx="6" fill="#56B4E9" fill-opacity="0.16" stroke="#56B4E9" stroke-width="1.2"/>
<text x="171.0" y="230.3" font-size="12.0" fill="#2B2B2B" text-anchor="middle" font-weight="bold">右</text>
<rect x="202.0" y="208.0" width="50.0" height="36.0" rx="6" fill="#56B4E9" fill-opacity="0.16" stroke="#56B4E9" stroke-width="1.2"/>
<text x="227.0" y="230.3" font-size="12.0" fill="#2B2B2B" text-anchor="middle" font-weight="bold">虎贲</text>
<rect x="258.0" y="208.0" width="50.0" height="36.0" rx="6" fill="#56B4E9" fill-opacity="0.16" stroke="#56B4E9" stroke-width="1.2"/>
<text x="283.0" y="230.3" font-size="12.0" fill="#2B2B2B" text-anchor="middle" font-weight="bold">羽林</text>
<text x="178.0" y="264.0" font-size="12" fill="#5A5A5A" text-anchor="middle">统郎官：三署郎、虎贲郎、羽林郎</text>
<text x="178.0" y="284.0" font-size="12" fill="#5A5A5A" text-anchor="middle">秩比二千石，低于诸将军</text>
<text x="542.0" y="80.0" font-size="14" fill="#D55E00" text-anchor="middle" font-weight="bold">唐代</text>
<rect x="412.0" y="92.0" width="260.0" height="40.0" rx="8" fill="#D55E00" fill-opacity="0.18" stroke="#D55E00" stroke-width="1.5"/>
<text x="542.0" y="116.5" font-size="12.5" fill="#2B2B2B" text-anchor="middle" font-weight="bold">皇　帝</text>
<rect x="412.0" y="146.0" width="260.0" height="40.0" rx="8" fill="#0072B2" fill-opacity="0.16" stroke="#0072B2" stroke-width="1.5"/>
<text x="542.0" y="170.3" font-size="12" fill="#2B2B2B" text-anchor="middle">十六卫（军事系统）与太子率府</text>
<path d="M 542 132 L 542 146" fill="none" stroke="#AFAFAF" stroke-width="1.6"/>
<text x="542.0" y="200.0" font-size="12" fill="#5A5A5A" text-anchor="middle">各置中郎将，统内府卫士</text>
<rect x="418.0" y="208.0" width="76.0" height="36.0" rx="6" fill="#009E73" fill-opacity="0.18" stroke="#009E73" stroke-width="1.2"/>
<text x="456.0" y="230.3" font-size="12.0" fill="#2B2B2B" text-anchor="middle" font-weight="bold">亲府</text>
<rect x="504.0" y="208.0" width="76.0" height="36.0" rx="6" fill="#009E73" fill-opacity="0.18" stroke="#009E73" stroke-width="1.2"/>
<text x="542.0" y="230.3" font-size="12.0" fill="#2B2B2B" text-anchor="middle" font-weight="bold">勋府</text>
<rect x="590.0" y="208.0" width="76.0" height="36.0" rx="6" fill="#009E73" fill-opacity="0.18" stroke="#009E73" stroke-width="1.2"/>
<text x="628.0" y="230.3" font-size="12.0" fill="#2B2B2B" text-anchor="middle" font-weight="bold">翊府</text>
<text x="542.0" y="264.0" font-size="12" fill="#5A5A5A" text-anchor="middle">统亲卫、勋卫、翊卫（内府卫士）</text>
<text x="542.0" y="284.0" font-size="12" fill="#5A5A5A" text-anchor="middle">正四品下；太子率府的为从四品上</text>
<path d="M 360 76 L 360 354" fill="none" stroke="#EDEDED" stroke-width="1.4" stroke-dasharray="5,5"/>
<text x="24.0" y="382.0" font-size="12" fill="#5A5A5A">汉代中郎将是「中郎」的统领，属光禄勋，性质是皇帝近侍与扈从；</text>
<text x="24.0" y="404.0" font-size="12" fill="#5A5A5A">唐代中郎将是武德七年由骠骑将军改称而来的统兵官，与「郎」已无关系。</text>
</svg>