<rect x="186" y="134" width="20.0" height="18" rx="9" fill="#0072B2" fill-opacity="0.30" stroke="#0072B2" stroke-width="1.4"/>
<text x="218.0" y="148.0" font-size="12.5" fill="#0072B2" font-weight="bold">1 个</text>
<text x="16.0" y="182.0" font-size="12.5" fill="#2B2B2B" font-weight="bold">唐玄宗（在位 44 年）</text>
