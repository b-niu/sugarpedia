<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 412" width="720" height="412" font-family="Segoe UI, Microsoft YaHei, Helvetica, Arial, sans-serif"><rect width="720" height="412" fill="white"/>
<text x="360.0" y="28.0" font-size="16" fill="#2B2B2B" text-anchor="middle" font-weight="bold">几支著名的行军</text>
<text x="360.0" y="50.0" font-size="12" fill="#5A5A5A" text-anchor="middle">同一场战争可以换一个「道」再打一次——因为道只是路线，不是编制</text>
<text x="32.0" y="88.0" font-size="12.5" fill="#2B2B2B" font-weight="bold">行军道</text>
<text x="186.0" y="88.0" font-size="12.5" fill="#2B2B2B" font-weight="bold">统帅</text>
<text x="340.0" y="88.0" font-size="12.5" fill="#2B2B2B" font-weight="bold">时间</text>
<text x="494.0" y="88.0" font-size="12.5" fill="#2B2B2B" font-weight="bold">目标</text>
<path d="M 24 98 L 696 98" stroke="#EDEDED" stroke-width="1.4"/>
<rect x="20" y="106" width="680" height="42" rx="6" fill="#D55E00" fill-opacity="0.07"/>
<text x="32.0" y="133.0" font-size="12.5" fill="#2B2B2B" font-weight="bold">代州道</text>
<text x="186.0" y="133.0" font-size="12.0" fill="#2B2B2B">李　靖</text>
<text x="340.0" y="133.0" font-size="12.0" fill="#2B2B2B">贞观三年（629）</text>
<text x="494.0" y="133.0" font-size="12.0" fill="#2B2B2B">东突厥颉利可汗</text>
<text x="32.0" y="179.0" font-size="12.5" fill="#2B2B2B" font-weight="bold">交河道</text>
<text x="186.0" y="179.0" font-size="12.0" fill="#2B2B2B">侯君集</text>
<text x="340.0" y="179.0" font-size="12.0" fill="#2B2B2B">贞观十三年（639）</text>
<text x="494.0" y="179.0" font-size="12.0" fill="#2B2B2B">高　昌</text>
<rect x="20" y="198" width="680" height="42" rx="6" fill="#D55E00" fill-opacity="0.07"/>
<text x="32.0" y="225.0" font-size="12.5" fill="#2B2B2B" font-weight="bold">辽东道</text>
<text x="186.0" y="225.0" font-size="12.0" fill="#2B2B2B">李　勣</text>
<text x="340.0" y="225.0" font-size="12.0" fill="#2B2B2B">贞观十九年（645）</text>
<text x="494.0" y="225.0" font-size="12.0" fill="#2B2B2B">高　丽</text>
<text x="32.0" y="271.0" font-size="12.5" fill="#2B2B2B" font-weight="bold">葱山道</text>
<text x="186.0" y="271.0" font-size="12.0" fill="#2B2B2B">程知节</text>
<text x="340.0" y="271.0" font-size="12.0" fill="#2B2B2B">永徽六年（655）</text>
<text x="494.0" y="271.0" font-size="12.0" fill="#2B2B2B">西突厥阿史那贺鲁</text>
<rect x="20" y="290" width="680" height="42" rx="6" fill="#0072B2" fill-opacity="0.07"/>
<text x="32.0" y="317.0" font-size="12.5" fill="#2B2B2B" font-weight="bold">伊丽道</text>
<text x="186.0" y="317.0" font-size="12.0" fill="#2B2B2B">苏定方</text>
<text x="340.0" y="317.0" font-size="12.0" fill="#2B2B2B">显庆二年（657）</text>
<text x="494.0" y="317.0" font-size="12.0" fill="#2B2B2B">西突厥阿史那贺鲁</text>
<text x="32.0" y="363.0" font-size="12.5" fill="#2B2B2B" font-weight="bold">河北道</text>
<text x="186.0" y="363.0" font-size="12.0" fill="#2B2B2B">李显（狄仁杰副）</text>
<text x="340.0" y="363.0" font-size="12.0" fill="#2B2B2B">圣历元年（698）</text>
<text x="494.0" y="363.0" font-size="12.0" fill="#2B2B2B">后突厥默啜</text>
<text x="24.0" y="400.0" font-size="12" fill="#5A5A5A">655 年程知节的葱山道行军，前军总管就是苏定方；两年后苏定方自领伊丽道，擒获贺鲁。</text>
</svg>