<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 434" width="720" height="434" font-family="Segoe UI, Microsoft YaHei, Helvetica, Arial, sans-serif"><rect width="720" height="434" fill="white"/>
<text x="360.0" y="28.0" font-size="16" fill="#2B2B2B" text-anchor="middle" font-weight="bold">狄仁杰的头衔：剧中与史书</text>
<text x="360.0" y="50.0" font-size="12" fill="#5A5A5A" text-anchor="middle">左为《神探狄仁杰》剧中的叠加头衔，右为史书所记的职务</text>
<rect x="24.0" y="68.0" width="324.0" height="32.0" rx="6" fill="#0072B2" fill-opacity="0.22" stroke="#0072B2" stroke-width="1.5"/>
<text x="186.0" y="88.5" font-size="12.5" fill="#2B2B2B" text-anchor="middle" font-weight="bold">《神探狄仁杰》剧中</text>
<text x="36.0" y="122.0" font-size="12.0" fill="#2B2B2B">同凤阁鸾台平章事（宰相）</text>
<text x="36.0" y="146.0" font-size="12.0" fill="#2B2B2B">内　史（即中书令）</text>
<text x="36.0" y="170.0" font-size="12.0" fill="#2B2B2B">户部侍郎</text>
<text x="36.0" y="194.0" font-size="12.0" fill="#2B2B2B">幽州大都督</text>
<text x="36.0" y="218.0" font-size="12.0" fill="#2B2B2B">洛州牧</text>
<text x="36.0" y="242.0" font-size="12.0" fill="#2B2B2B">河北道行军大总管</text>
<text x="36.0" y="266.0" font-size="12.0" fill="#2B2B2B">葱山道行军大总管</text>
<text x="36.0" y="290.0" font-size="12.0" fill="#2B2B2B">流沙道行军大总管</text>
<text x="36.0" y="314.0" font-size="12.0" fill="#2B2B2B">两道黜置大使、黜陟使</text>
<rect x="372.0" y="68.0" width="324.0" height="32.0" rx="6" fill="#D55E00" fill-opacity="0.22" stroke="#D55E00" stroke-width="1.5"/>
<text x="534.0" y="88.5" font-size="12.5" fill="#2B2B2B" text-anchor="middle" font-weight="bold">史书所记</text>
<text x="384.0" y="122.0" font-size="12.0" fill="#2B2B2B">神功元年（697）幽州都督</text>
<text x="384.0" y="140.0" font-size="12.0" fill="#5A5A5A">备御契丹</text>
<text x="384.0" y="164.0" font-size="12.0" fill="#2B2B2B">圣历元年（698）</text>
<text x="384.0" y="182.0" font-size="12.0" fill="#5A5A5A">河北道行军副元帅</text>
<text x="384.0" y="206.0" font-size="12.0" fill="#2B2B2B">　（太子李显为元帅，狄仁杰代行）</text>
<text x="384.0" y="230.0" font-size="12.0" fill="#2B2B2B">同凤阁鸾台平章事、内史</text>
<text x="384.0" y="248.0" font-size="12.0" fill="#5A5A5A">武则天时确任此职</text>
<text x="384.0" y="272.0" font-size="12.0" fill="#2B2B2B">黜陟使</text>
<text x="384.0" y="290.0" font-size="12.0" fill="#5A5A5A">武则天时确有此类差遣</text>
<path d="M 360 68 L 360 358" fill="none" stroke="#EDEDED" stroke-width="1.4" stroke-dasharray="5,5"/>
<text x="24.0" y="380.0" font-size="12" fill="#5A5A5A">剧中诏书原话：「加葱山道行军大总管、流沙道行军大总管，并两道黜置大使，</text>
<text x="24.0" y="402.0" font-size="12" fill="#5A5A5A">统领安西、北庭、崑陵、濛池四都护府……遇不决之事，不必请奏。」</text>
<text x="24.0" y="422.0" font-size="12" fill="#5A5A5A">「某某道行军大总管」正是唐代真实的名号格式。</text>
</svg>